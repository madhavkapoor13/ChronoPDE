project:
  name: chronopde
  artifact_root: artifacts/runs

pde:
  du: 0.001
  dv: 0.005
  k: 0.005
  t_start: 0.0
  t_end: 50.0
  stored_times: 101
  x_min: -1.0
  x_max: 1.0
  y_min: -1.0
  y_max: 1.0
  height: 64
  width: 64
  boundary: neumann
  solver:
    method: DOP853
    rtol: 1.0e-7
    atol: 1.0e-9

data:
  output_path: data/chronopde.h5
  sample_path: data/sample.h5
  manifest_path: reports/dataset/week3/manifest.csv
  generation_directory: artifacts/dataset/week3
  report_directory: reports/dataset/week3
  workers: 4
  train_trajectories: 320
  validation_trajectories: 60
  id_test_trajectories: 100
  ood_parameter_trajectories: 120
  ood_ic_trajectories: 120
  train_ranges:
    du: [0.0008, 0.0012]
    dv: [0.0040, 0.0060]
    k: [0.0040, 0.0060]
  ood_ranges:
    du: [[0.0006, 0.00075], [0.00125, 0.0014]]
    dv: [[0.0030, 0.0038], [0.0062, 0.0070]]
    k: [[0.0025, 0.0038], [0.0062, 0.0075]]
  retention_fractions: [1.0, 0.5, 0.25]
  base_seed: 1729
  initial_conditions:
    train_modes: [1, 8]
    train_standard_deviation: 0.5
    ood_modes: [9, 16]
    ood_amplitude_multiplier: 1.5
  pilot:
    trajectories: 24
    divergence_threshold: 10.0
    maximum_failure_fraction: 0.10
    maximum_adjustment_rounds: 2
    workers: 4
    output_directory: artifacts/pilot/week2

model:
  name: chronopde
  state_channels: 2
  width: 57
  spectral_modes_x: 12
  spectral_modes_y: 12
  blocks: 4
  conditioning_features: 4
  activation: gelu
  spline: quintic
  perturbation_gamma: 1.0e-5
  unet_channels: [32, 64, 128, 256]
  fno_width: 29
  film_hidden_width: 128

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  max_epochs: 150
  patience: 20
  gradient_clip: 1.0
  spectral_loss_weight: 0.05
  precision: float32
  seed: 0
  num_workers: 2
  minimum_epochs: 25
  minimum_learning_rate: 1.0e-6
  smoke_batch_size: 16
  smoke_learning_rate: 1.0e-3
  smoke_max_steps: 10000
  smoke_evaluation_interval: 100
  smoke_loss_reduction: 100.0
  smoke_one_step_nrmse: 0.01
  smoke_rollout_nrmse: 0.05
  continuous_validation_interval: 5

evaluation:
  solver: rk4
  steps_per_interval: 2
  correlation_threshold: 0.9
  divergence_threshold: 10.0
  bootstrap_resamples: 10000
  timing_warmups: 10
  timing_repetitions: 100
