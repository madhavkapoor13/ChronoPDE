[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronopde"
version = "0.1.0"
description = "Boundary-aware continuous-time neural operators for irregular reaction-diffusion dynamics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Madhav Kapoor" }]
dependencies = [
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.12,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]
demo = ["streamlit>=1.36,<2"]

[tool.setuptools.packages.find]
include = ["chronopde*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chronopde"]
warn_unreachable = true

